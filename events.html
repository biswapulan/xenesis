<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Events · XENESIS 4.0</title><meta name="theme-color" content="#0b0f12">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<style>
.hd{text-align:center;padding:10px 0 6px}.hd h1{font-size:clamp(26px,6vw,46px)}.hd p{max-width:46ch;margin:12px auto 0;opacity:.85;font-size:14px}
.tabs{display:flex;justify-content:center;gap:10px;margin:22px 0 26px;flex-wrap:wrap}
.tab{font:700 12px var(--sans);letter-spacing:.24em;text-transform:uppercase;padding:13px 24px;border:1.5px solid rgba(232,228,218,.4);background:rgba(11,15,18,.55);color:var(--bone);cursor:pointer;transition:.25s}
.tab:hover{border-color:var(--crim)}.tab[aria-selected=true]{background:var(--crim);border-color:var(--crim);box-shadow:inset 0 0 0 1px rgba(232,228,218,.35)}
.tab span{opacity:.7;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:20px}
.ev{position:relative;display:flex;flex-direction:column;padding:26px 24px 22px;background:linear-gradient(180deg,rgba(11,15,18,.62),rgba(11,15,18,.86));border:1px solid rgba(232,228,218,.14);backdrop-filter:blur(3px);transition:.3s}
.ev:hover{border-color:var(--crim);transform:translateY(-3px);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(176,32,42,.18)}
.ev::before{content:attr(data-jp);position:absolute;top:10px;right:14px;font:700 40px var(--min);color:rgba(176,32,42,.28);pointer-events:none}
.grp{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);font-weight:600;min-height:16px}
.ev h2{font-size:17px;margin:8px 36px 12px 0;letter-spacing:.1em}
.ev p.s{font-size:13.5px;opacity:.82;line-height:1.65;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.chip{border:1px solid rgba(232,228,218,.3);padding:5px 11px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.chip.fee{background:rgba(176,32,42,.85);border-color:var(--crim)}
.pz{font-size:11.5px;letter-spacing:.06em;opacity:.75;margin-bottom:16px}.pz b{color:var(--amber);letter-spacing:.2em;font-size:10px;text-transform:uppercase;margin-right:6px}
@media (max-width:520px){.tab{padding:12px 18px}.ev{padding:22px 18px 18px}.acts .btn{flex:1 1 100%!important}}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1;padding:12px 10px;font-size:10.5px;letter-spacing:.18em}
</style></head>
<body data-page="events.html">
<div class="app"><main>
 <section class="hd in"><h1>Events<span class="kj" lang="ja">競技</span></h1><hr class="blade" style="width:min(260px,60%);margin:18px auto">
 <p>Pick your battle. Every event is open to registration, so choose one or try them all.</p></section>
 <div class="tabs" role="tablist" aria-label="Event type">
  <button class="tab" role="tab" id="t-tech" aria-controls="grid" data-t="tech">Tech<span id="n-tech"></span></button>
  <button class="tab" role="tab" id="t-non-tech" aria-controls="grid" data-t="non-tech">Non-Tech<span id="n-non-tech"></span></button>
 </div>
 <div class="grid" id="grid" role="tabpanel" aria-live="polite"></div>
</main></div>
<script src="events-data.js?v=9"></script><script src="shared.js?v=3"></script>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grid=document.getElementById("grid");
["tech","non-tech"].forEach(t=>document.getElementById("n-"+t).textContent=XEN_EVENTS.filter(e=>e.type===t).length);
function card(e){
 const reg=e.fee==null?`<a class="btn" aria-disabled="true" href="#">Fee TBA</a>`:`<a class="btn" href="register.html?event=${e.id}">Register Now</a>`;
 return `<article class="ev in" data-jp="${e.jp}"><p class="grp">${esc(e.group||(e.type==="tech"?"Tech Event":"Non-Tech Event"))}</p>
 <h2>${esc(e.name)}</h2><p class="s">${esc(e.summary)}</p>
 <div class="chips"><span class="chip">${xenTeam(e)}</span><span class="chip fee">${xenFee(e)}</span>${e.duration?`<span class="chip">${e.duration}</span>`:""}</div>
 ${e.prize?`<p class="pz"><b>Prize</b>${esc(e.prize)}</p>`:`<p class="pz"><b>Prize</b>Announced soon</p>`}
 <div class="acts"><a class="btn ghost" href="event.html?id=${e.id}">View Details</a>${reg}</div></article>`;
}
function select(t,push){
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
 grid.setAttribute("aria-labelledby","t-"+t);
 grid.innerHTML=XEN_EVENTS.filter(e=>e.type===t).map(card).join("");
 if(push)history.replaceState(null,"","#"+t);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>select(b.dataset.t,true));
select(location.hash==="#non-tech"?"non-tech":"tech");
addEventListener("hashchange",()=>select(location.hash==="#non-tech"?"non-tech":"tech"));
</script></body></html>
