<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event · XENESIS 4.0</title><meta name="theme-color" content="#0b0f12">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.back{display:inline-block;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;opacity:.75;margin:4px 0 18px}.back:hover{opacity:1;color:var(--amber)}
.hero{position:relative;padding:8px 0 4px}.hero::after{content:attr(data-jp);position:absolute;right:0;top:-10px;font:700 clamp(60px,14vw,130px) var(--min);color:rgba(176,32,42,.22);pointer-events:none;line-height:1}
.grp{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--amber);font-weight:600}
.hero h1{font-size:clamp(24px,5.4vw,44px);margin:10px 0 8px;max-width:20ch}.tg{font:500 15px var(--min);letter-spacing:.14em;opacity:.85}
.layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start;margin-top:8px}
.panel{background:linear-gradient(180deg,rgba(11,15,18,.62),rgba(11,15,18,.88));border:1px solid rgba(232,228,218,.14);backdrop-filter:blur(3px);padding:26px 28px}
.sec+.sec{margin-top:26px;padding-top:24px;border-top:1px solid rgba(232,228,218,.12)}
.sec h2{font-size:13px;letter-spacing:.3em;color:var(--amber);margin-bottom:12px}
.sec p{opacity:.9;font-size:14.5px;line-height:1.75}
.sec ul{list-style:none;padding:0;display:grid;gap:9px}
.sec li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.6;opacity:.92}
.sec li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:5px;background:var(--crim);clip-path:polygon(0 0,100% 45%,100% 55%,0 100%)}
.side{position:sticky;top:16px}.side dl{display:grid;gap:0}
.side .r{padding:12px 0;border-bottom:1px solid rgba(232,228,218,.12)}
.side dt{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--amber);font-weight:600}
.side dd{font-size:15px;font-weight:600;margin-top:2px}.side dd.big{font-size:24px;color:var(--bone)}
.side .btn{width:100%;margin-top:20px}.side .btn+.btn{margin-top:10px}
.fy{font-size:12.5px;opacity:.75;line-height:1.65}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pager a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.8;max-width:48%}.pager a:hover{opacity:1;color:var(--amber)}
@media (max-width:860px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.panel{padding:22px 20px}.hero::after{opacity:.6}}
</style></head>
<body data-page="events.html">
<div class="app"><main id="m"></main></div>
<script src="events-data.js"></script><script src="events-details.js"></script><script src="shared.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=new URLSearchParams(location.search).get("id"),i=XEN_EVENTS.findIndex(e=>e.id===id),m=document.getElementById("m");
if(i<0){document.title="Event not found · XENESIS 4.0";m.innerHTML=`<section class="panel in" style="max-width:560px;margin:40px auto;text-align:center"><h1 style="font-size:24px">Event not found<span class="kj" lang="ja">見つかりません</span></h1><hr class="blade"><p style="opacity:.85">That event doesn't exist. Head back and pick one from the list.</p><p style="margin-top:22px"><a class="btn" href="events.html">All Events</a></p></section>`}
else{
 const e=XEN_EVENTS[i],d=XEN_DETAILS[id]||{sections:[]},I=XEN_INFO,tab=e.type==="tech"?"#tech":"#non-tech";
 document.title=e.name+" · XENESIS 4.0";
 const row=(k,v,c)=>v?`<div class="r"><dt>${k}</dt><dd class="${c||""}">${esc(v)}</dd></div>`:"";
 const sec=s=>`<div class="sec"><h2>${esc(s.h)}</h2>${s.p?`<p>${esc(s.p)}</p>`:""}${s.items?`<ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`;
 const co=I.coordinators.length?`<div class="sec"><h2>Coordinators</h2><ul>${I.coordinators.map(c=>`<li>${esc(c.name)} · <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></li>`).join("")}</ul></div>`:"";
 const reg=e.fee==null?`<a class="btn" aria-disabled="true" href="#">Fee TBA</a>`:`<a class="btn" href="register.html?event=${e.id}">Register Now</a>`;
 const p=XEN_EVENTS[i-1],n=XEN_EVENTS[i+1];
 m.innerHTML=`<a class="back" href="events.html${tab}">← All events</a>
 <section class="hero in" data-jp="${e.jp}"><p class="grp">${esc(e.group||(e.type==="tech"?"Tech Event":"Non-Tech Event"))}</p><h1>${esc(e.name)}</h1>${d.tag?`<p class="tg">${esc(d.tag)}</p>`:""}<hr class="blade"></section>
 <div class="layout in"><article class="panel">${d.sections.map(sec).join("")}
  <div class="sec"><h2>Prizes</h2><p>${esc(e.prize)}</p><p class="fy" style="margin-top:10px">All position holders receive certificates. If no first-year student secures a top-three position, the highest-ranked eligible first-year participant/team receives a special gift.</p></div>${co}</article>
 <aside class="panel side"><dl>${row("Registration fee",xenFee(e),"big")}${row("Format",xenTeam(e))}${row("Duration",e.duration)}${row("Date",I.date)}${row("Time",I.time)}${row("Venue",I.venue)}</dl>${I.notice?`<p class="fy" style="margin-top:14px">${esc(I.notice)}</p>`:""}${reg}<p class="fy" style="margin-top:12px;text-align:center">Questions? <a href="help.html" style="color:var(--amber)">Ask the help desk</a></p><a class="btn ghost" href="events.html${tab}">Browse Events</a></aside></div>
 <nav class="pager" aria-label="Other events"><span>${p?`<a href="event.html?id=${p.id}">← ${esc(p.name)}</a>`:""}</span><span>${n?`<a href="event.html?id=${n.id}">${esc(n.name)} →</a>`:""}</span></nav>`;
}
</script></body></html>
