.frame{position:relative;margin:18px 0 0;width:min(78vw,310px);aspect-ratio:4/5;overflow:hidden;background:#12171b;

.sound{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:10px;

.sound i{display:flex;gap:2px;align-items:flex-end;height:12px}
.sound i b{width:2px;height:3px;background:var(--bone)}
.sound.on{border-color:var(--crim)}
.sound.on i b{animation:eq .9s ease-in-out infinite alternate}
.sound.on i b:nth-child(2){animation-delay:.2s}.sound.on i b:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:12px}}
@media (prefers-reduced-motion:reduce){.sound.on i b{animation:none;height:8px}}

/* rotating lines */
.bio{position:relative;width:100%;margin:20px 0 0;padding:16px 18px 14px;border-left:3px solid var(--crim);

.bio p{grid-area:1/1;margin:0;font:700 clamp(16px,4.8vw,19px)/1.5 var(--min);color:var(--bone);text-wrap:balance;
  opacity:0;transform:translateY(6px);transition:opacity .7s ease,transform .7s ease}
.bio p.on{opacity:1;transform:none}
.bio p::before{content:"“";color:var(--crim);font-size:1.5em;line-height:0;vertical-align:-.28em;margin-right:4px}
.dots{display:flex;gap:7px;margin-top:12px}
.dots b{width:18px;height:3px;background:rgba(232,228,218,.22);transition:background .4s}
.dots b.on{background:var(--crim)}
@media (prefers-reduced-motion:reduce){.bio .stack{display:block}.bio p{opacity:1;transform:none;margin:0 0 10px;transition:none}.dots{display:none}}

<script>
(function(){
  var a=document.getElementById('bgm'), btn=document.getElementById('sound'), tx=document.getElementById('soundTx');
  a.volume=0.4; var wantOn=true;
  function ui(on){ btn.classList.toggle('on',on); btn.setAttribute('aria-pressed',on?'true':'false'); tx.textContent=on?'Sound on':'Sound off'; }
  function play(){ var p=a.play(); if(p&&p.then) p.then(function(){ui(true);}).catch(function(){ui(false);}); else ui(true); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); if(a.paused){wantOn=true;play();} else {wantOn=false;a.pause();ui(false);} });
  play();
  var evs=['pointerdown','keydown','touchend'];
  function first(e){ if(btn.contains(e.target)) return; if(wantOn&&a.paused) play(); if(!a.paused) evs.forEach(function(t){removeEventListener(t,first,true);}); }
  evs.forEach(function(t){ addEventListener(t,first,true); });
  document.addEventListener('visibilitychange',function(){ if(document.hidden) a.pause(); else if(wantOn) a.play().catch(function(){}); });
})();
</script>
<script>
(function(){
  var b=document.querySelector('.bio'); if(!b) return;
  var ps=[].slice.call(b.querySelectorAll('p')), ds=[].slice.call(b.querySelectorAll('.dots b')), i=0, timer;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function show(n){ i=(n+ps.length)%ps.length; ps.forEach(function(p,k){p.classList.toggle('on',k===i);}); ds.forEach(function(d,k){d.classList.toggle('on',k===i);}); }
  function start(){ clearInterval(timer); timer=setInterval(function(){show(i+1);},4200); }
  show(0); start();
  b.addEventListener('click',function(){ show(i+1); start(); });
})();
</script>
<script>
(function(){

  document.querySelectorAll("a.link").forEach(function(a){
    a.addEventListener("click", function(e){
      var web = a.getAttribute("href"), intent = a.dataset.android, scheme = a.dataset.ios;
      if (android && intent) { e.preventDefault(); window.location.href = intent; return; }
      if (ios && scheme) {
        e.preventDefault();
        var t = Date.now(); window.location.href = scheme;
        setTimeout(function(){ if (!document.hidden && Date.now()-t < 2600) window.location.href = web; }, 900);

    });

})();
