<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Samurai Worlds · X Games · XENESIS 4.0</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f7f7; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  #fs { position: fixed; top: 12px; left: 12px; z-index: 2; font: 14px system-ui, sans-serif; padding: 6px 12px;
        border-radius: 6px; cursor: pointer; background: rgba(128,128,128,.25); color: #777; border: 1px solid rgba(128,128,128,.5); transition: opacity .4s; }
  #back { position: fixed; top: 52px; left: 12px; z-index: 2; font: 14px system-ui, sans-serif; padding: 6px 12px; border-radius: 6px; cursor: pointer;
          background: rgba(128,128,128,.25); color: #777; border: 1px solid rgba(128,128,128,.5); text-decoration: none; transition: opacity .4s; }
  #back:hover { background: rgba(128,128,128,.4); color: #333; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="fs" tabindex="-1">Fullscreen (F)</button>
<a id="back" href="../games.html" aria-label="Back to X Games">&larr; X Games</a>
<script>
/* Show the back button together with the Fullscreen button (the game hides both while you are playing) */
(function(){var fs=document.getElementById('fs'),bk=document.getElementById('back');
 function sync(){bk.style.opacity=fs.style.opacity;bk.style.pointerEvents=fs.style.pointerEvents;}
 new MutationObserver(sync).observe(fs,{attributes:true,attributeFilter:['style']});sync();})();
</script>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d'), fsBtn = document.getElementById('fs');
  let W = 800, H = 300, GY = 210, VS = 1;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const DX = () => Math.max(40, Math.min(140, W * 0.08));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const FONT = 'system-ui, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif';

  function resize() {
    const w = innerWidth, h = innerHeight, s = Math.min(h / 300, w / 600);
    VS = s; W = w / s; H = h / s; GY = Math.round(H * 0.68);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
    if (typeof buildBackdrop === 'function') buildBackdrop();
  }

  const START_SPEED = 330, MAX_SPEED = 900, ACCEL = 7, GRAVITY = 1900, JUMP_V = 620, FEVER_AT = 15, DW = 60, DH = 51, EVO_AT = 7, SIZE_STEP = .11, MAX_GROW = 9;   // evolve + grow every 7 coins; +11% size per level, up to 9 levels (x1.99, nearly double)

  // ---------- Scenes: the world changes every 300 points ----------
  // colours: sky top, sky bottom, sun/glow, mountains, ground, obstacle ink, accent
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const SCENES = [
    { n: 'Classic',        acc: '#535353', body: '#535353', c: ['#f7f7f7', '#f7f7f7', '#f7f7f7', '#f7f7f7', '#f7f7f7', '#535353', '#535353'] },
    { n: 'Samurai Dawn',   acc: '#f2c14e', body: '#4fae6a', c: ['#ffd1a8', '#ff8a7a', '#ff3b3b', '#b46b8a', '#3b2a3a', '#2b1b1f', '#f2c14e'] },
    { n: 'Volcano Shrine', acc: '#ff8a1a', body: '#d9532b', c: ['#2b0a0a', '#b8360f', '#ffb347', '#3a1010', '#1c0707', '#150606', '#ff8a1a'] },
    { n: 'Neon Tokyo',     acc: '#35f0ff', body: '#2c3a8c', c: ['#14052e', '#ff2f9a', '#35f0ff', '#2a0f5a', '#0b0220', '#0b0220', '#35f0ff'] },
    { n: 'Winter Shrine',  acc: '#6fb3e0', body: '#4f9fd6', c: ['#b7d7ee', '#e4f1fa', '#ffffff', '#8fa9c4', '#eef5fa', '#2f4b66', '#6fb3e0'] },
    { n: 'Moonlit Ninja',  acc: '#9fe6c0', body: '#2a3358', c: ['#050b1a', '#1c2d4f', '#fff6d0', '#0f1d33', '#0a1020', '#a9d9c4', '#9fe6c0'] },
    { n: 'Great Wave',     acc: '#e8f6ff', body: '#e0873a', c: ['#fdf0d5', '#8cc3e0', '#fff3c0', '#2b5f8a', '#14365c', '#0e2a47', '#e8f6ff'] },
    { n: 'Xenesis',        acc: '#ff3b4a', body: '#d4202f', c: ['#060001', '#4a0710', '#ff2a3a', '#2a0509', '#0c0102', '#0a0102', '#ff3b4a'] }
  ].map(s => ({ ...s, c: s.c.map(hex) }));
  const SCENE_LEN = 199;                                          // a new theme every 199 points
  const ORDER = [0, 7, 1, 2, 3, 4, 5, 6];                        // Xenesis is the first world you reach
  const sceneOf = sc => { const k = Math.floor(sc / SCENE_LEN); return k === 0 ? 0 : ORDER[((k - 1) % (ORDER.length - 1)) + 1]; };
  let cur;
  const C = (i, a = 1) => `rgba(${cur[i].map(Math.round)},${a})`;
  const mixc = (i, j, t) => `rgb(${cur[i].map((v, k) => Math.round(v + (cur[j][k] - v) * t))})`;
  const lum = i => .299 * cur[i][0] + .587 * cur[i][1] + .114 * cur[i][2];

  // ---------- A new feature every 100 points ----------
  const UNLOCKS = [
    { at: 100,  id: 'coins',    title: 'Coins & combos',   tip: 'Grab coins in a row for combo points' },
    { at: 200,  id: 'birds',    title: 'Flying enemies',   tip: 'Duck with ↓ or jump over them' },
    { at: 300,  id: 'double',   title: 'Double jump',      tip: 'Press jump again in mid-air' },
    { at: 400,  id: 'powers',   title: 'Power-ups',        tip: 'Shield blocks a hit, the clock slows time' },
    { at: 500,  id: 'meteors',  title: 'Falling fire',     tip: 'A "!" shows where it will land' },
    { at: 600,  id: 'tight',    title: 'Close calls',      tip: 'Skim an obstacle for bonus. Tight pairs appear' },
    { at: 700,  id: 'fever',    title: 'Samurai Rage',     tip: 'Collect 15 coins, then slash everything' },
    { at: 800,  id: 'shower',   title: 'Fire rain',        tip: 'Falling fire comes twice as often' },
    { at: 900,  id: 'flocks',   title: 'Flocks',           tip: 'Flying enemies now come in pairs' },
    { at: 1000, id: 'shuriken', title: 'Shuriken',         tip: 'Fast spinning stars fly low and mid' },
    { at: 1100, id: 'hyper',    title: 'Hyper speed',      tip: 'The world just got faster' }
  ];

  // ---------- Audio ----------
  let audio;
  function beep(f, d, t = 'square', v = 0.05) {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume(); const o = audio.createOscillator(), g = audio.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v;
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d); o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + d); } catch (e) {}
  }
  function sweep(f0, f1, d, type = 'sawtooth', v = 0.05) {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), n = audio.currentTime; o.type = type;
      o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), n + d);
      g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d); o.connect(g); g.connect(audio.destination); o.start(); o.stop(n + d); } catch (e) {}
  }
  function noiseSweep(f0, f1, d, v = 0.08) {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume();
      const n = Math.max(1, audio.sampleRate * d | 0), buf = audio.createBuffer(1, n, audio.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
      const src = audio.createBufferSource(), bp = audio.createBiquadFilter(), g = audio.createGain(), now = audio.currentTime; src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(f0, now); bp.frequency.exponentialRampToValueAtTime(Math.max(30, f1), now + d);
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(v, now + d * .25); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
      src.connect(bp); bp.connect(g); g.connect(audio.destination); src.start(); } catch (e) {}
  }
  let hi = 0; try { hi = +localStorage.getItem('dino-samurai-hi') || 0; } catch (e) {}
  const saveHi = () => { try { localStorage.setItem('dino-samurai-hi', hi); } catch (e) {} };

  // ---------- Dino sprite (the classic T-Rex) ----------
  const BODY = ["..........########..","..........##.#####..","..........########..","..........########..","..........#####.....",
    "#.........#####.....","#........######.....","##......#######.#...","###....###########..","####..############..",
    ".###############.#..","..##############....","...############.....","....##########......"];
  const LEGS = [[".....###..##........", ".....##...#.........", ".....#....##........"],
                [".....##...###.......", ".....#....##........", ".....##...#........."]];
  const PX = 3;
  const rows = (r, x, y) => r.forEach((row, i) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') ctx.fillRect(x + c * PX, y + i * PX, PX, PX); });

  // ---------- State ----------
  let state = 'idle', introT = 0, fadeIn = 9, speed, score, runTime, T = 0, dist, flash, overAt, coinCount, combo, comboT, shield, slow, inv, jumps, shake, newBest, fever, charge, nextU, banner;
  let scene, from, blendT, wflash, ring, evoLv, lastH, sizeV = 1, popT = 9;
  let dino, obstacles, coins, pows, meteor, meteorT, parts, floaters, clouds, bumps, deco, weather, duckHeld = false;
  let camY = 0, wz = 1, spFade = 0, spCD = 0, spT = 0, spData = null, vScene = 0, wf = 9, wfAmp = 0, wfDur = 1, ramp = 9, readyAt = 0, HALO = true, errN = 0, fsHidden = false;
  const has = id => UNLOCKS.findIndex(u => u.id === id) < nextU;

  function buildBackdrop() {
    clouds = Array.from({ length: Math.max(4, W / 200 | 0) }, () => ({ x: rnd(0, W), y: rnd(20, Math.max(50, GY - 140)) }));
    bumps = Array.from({ length: W / 24 | 0 }, () => ({ x: rnd(0, W), w: rnd(1, 4), dy: rnd(8, Math.max(12, (H - GY) * .85)) }));
    deco = Array.from({ length: Math.ceil(W / 260) + 2 }, (_, i) => ({ x: i * 260 + rnd(0, 90), t: i % 2 }));
    weather = Array.from({ length: Math.round(W / 40) }, () => ({ x: rnd(0, W), y: rnd(0, H), v: Math.random(), ph: rnd(0, 6), r: rnd(2.5, 4.5) }));
  }
  function reset() {
    speed = START_SPEED; score = 0; runTime = 0; dist = 0; flash = 0; coinCount = 0; combo = 0; comboT = 0;
    fever = 0; charge = 0; shield = false; slow = 0; inv = 0; jumps = 0; shake = 0; newBest = false; nextU = 0;
    scene = 0; from = 0; blendT = 1; wf = 9; wfAmp = 0; ring = -1; camY = 0; wz = 1; spFade = 0; spCD = 0; spData = null; vScene = 0; ramp = 9; evoLv = 0; lastH = 0; sizeV = 1; popT = 9;
    banner = { t: 0 }; dino = { y: 0, vy: 0, duck: false };
    obstacles = []; coins = []; pows = []; meteor = null; meteorT = 3; parts = []; floaters = [];
    cur = SCENES[0].c.map(a => a.slice());
    buildBackdrop();
  }
  resize(); reset(); addEventListener('resize', resize);

  const burst = (x, y, n, sp = 220, c = null) => { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), v = rnd(40, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rnd(.4, .9), max: .9, s: rnd(2, 5), c }); } };
  const say = (x, y, text, c = null) => floaters.push({ x, y, text, c, t: 1 });
  const fan = () => [520, 660, 880].forEach((f, i) => setTimeout(() => beep(f, .15, 'square', .05), i * 110));

  function unlock(u) {
    if (banner.t > 0 && banner.scene) { banner.title = u.title; banner.tip = u.tip; banner.t = 3; } else banner = { t: 2.6, title: u.title, tip: u.tip };
    flash = 1; shake = .2; fan();
    if (u.id === 'hyper') speed = Math.min(MAX_SPEED, speed * 1.12);
  }
  const FORMS = [['Spiked Rex', 'Crowned Rex', 'Golden Halo Rex'], ['Crested Samurai', 'Dual-blade Shogun', 'Crimson Spirit Shogun'], ['Spiked Magma Rex', 'Veined Lava Lord', 'Phoenix-wing Rex'], ['Neon Spine Rex', 'Hover Cyber Rex', 'Holo-wing Rex'], ['Ice Crystal Rex', 'Frost Armor Rex', 'Blizzard Spirit Rex'], ['Scarf Ninja', 'Shadow Clone Ninja', 'Triple Shadow Ninja'], ['Bubble Tide Rex', 'Wave Cape Rex', 'Great Wave Rex'], ['Blossom Blade Rex', 'Xenesis Shogun', 'Crimson Xenesis Spirit']];
  function evolve() {                                             // every 7 coins (EVO_AT): new form, free shield, and the dino grows
    evoLv = Math.floor(coinCount / EVO_AT); popT = 0; shield = true; inv = Math.max(inv, 1.5); score += EVO_AT; flash = 1; shake = .25; wf = 0; wfDur = .8; wfAmp = .26; ring = 0;
    burst(DX() + DW / 2, GY - dino.y - 25, 40, 380, SCENES[scene].acc);
    banner = { t: 3.2, evo: true, title: 'EVOLVED! Lv ' + evoLv + ': ' + FORMS[scene][Math.min(3, evoLv) - 1], tip: evoLv <= MAX_GROW ? 'You grew bigger (x' + (1 + SIZE_STEP * evoLv).toFixed(2) + ')! Free shield, +' + EVO_AT + ' points. Bigger body = harder to dodge.' : 'Max size reached. Free shield and +' + EVO_AT + ' points.' };
    [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .16, 'triangle', .06), i * 80));
  }
  function changeScene(ns, u) {
    from = scene; scene = ns; blendT = 0; wf = 0; wfDur = 1.2; wfAmp = .34; shake = .1; ring = 0; flash = 1;
    burst(DX() + DW / 2, GY - dino.y - 25, 44, 400, SCENES[ns].acc);
    banner = { t: 3, scene: SCENES[ns].n, title: u ? u.title : '', tip: u ? u.tip : 'The world transforms!' };
    [440, 554, 659, 880].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .06), i * 100));
    if (u && u.id === 'hyper') speed = Math.min(MAX_SPEED, speed * 1.12);
  }

  // ---------- Input ----------
  function startIntro() { state = 'intro'; introT = 0; duckHeld = false; }
  function beginRun() {                                              // the player pressed start: ease into the run
    state = 'run'; ramp = 0; inv = Math.max(inv, .8); fadeIn = .5;
    beep(660, .1, 'square', .04); setTimeout(() => beep(880, .12, 'square', .04), 90);
  }
  function jump() {
    if (state === 'intro') { introT = Math.max(introT, 7.5); return; }                // any key / tap skips to the flash
    if (state === 'space') return;                                                   // the Xenesis interlude plays on its own
    if (state === 'ready') { if (performance.now() - readyAt > 450) beginRun(); return; }   // intro is over: wait for the player
    if (state === 'idle') { startIntro(); return; }                                  // every new game opens with the intro
    if (state === 'over') { if (performance.now() - overAt > 400) { reset(); startIntro(); } return; }
    const px = DX() + DW / 2;
    if (dino.y === 0) { dino.vy = JUMP_V * Math.sqrt(sizeV); jumps = 1; beep(660, .12); burst(px, GY, 4, 90); }
    else if (has('double') && jumps < 2) { dino.vy = JUMP_V * .85 * Math.sqrt(sizeV); jumps = 2; beep(920, .12, 'triangle'); burst(px, GY - dino.y, 8, 120, SCENES[scene].acc); }
  }
  function fullscreen() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
  fsBtn.onclick = () => { fullscreen(); fsBtn.blur(); };
  document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen (F)' : 'Fullscreen (F)'; });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) jump(); }
    if (e.code === 'ArrowDown') { e.preventDefault(); duckHeld = true; }
    if (e.code === 'KeyF' && !e.repeat) fullscreen();
  });
  addEventListener('keyup', e => { if (e.code === 'ArrowDown') duckHeld = false; });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

  // ---------- Spawning (obstacles depend on the scene) ----------
  const KINDS = [['cactus', 'cactus'], ['lantern', 'bamboo'], ['rock', 'flame'], ['chochin', 'sign'], ['snowlantern', 'snowman'], ['stakes', 'bamboo'], ['wave', 'wtorii'], ['chochin', 'wtorii']];
  function spawn() {
    let o; const r = Math.random(), sh = has('shuriken') ? .16 : 0, s = scene;
    if (r < sh) o = { type: 'star', s, x: W + 60, w: 26, h: 26, lift: [22, 55][Math.random() * 2 | 0] };
    else if (has('birds') && r < sh + Math.min(.3, .12 + score / 4000)) {
      const lift = [18, 48, 80][Math.random() * 3 | 0];
      o = { type: 'bird', s, x: W + 60, w: 42, h: 28, lift };
      if (has('flocks') && Math.random() < .4) { obstacles.push(o); o = { type: 'bird', s, x: W + 135, w: 42, h: 28, lift }; }
    } else {
      const n = 1 + (Math.random() * 3 | 0), tall = Math.random() < .5, h = tall ? 62 : 44;
      o = { type: 'ground', s, kind: KINDS[s][tall ? 1 : 0], seed: Math.random() * 4 | 0, x: W + 60, w: 28 + (n - 1) * 22, h, n, lift: 0 };
      if (has('coins') && Math.random() < .6) for (let i = 0; i < 5; i++)
        coins.push({ x: W + 10 + i * (o.w + 100) / 4, lift: 24 + (h + 30) * Math.sin(Math.PI * i / 4), ph: i });
    }
    o.gap = o.w + speed * rnd(.72, 1.5);
    if (has('tight') && Math.random() < .12) o.gap = o.w + speed * .32;
    if (has('powers') && o.type === 'ground' && Math.random() < .1) pows.push({ type: Math.random() < .5 ? 'shield' : 'slow', x: W + 60 + o.w + o.gap / 2, lift: 45 });
    obstacles.push(o);
  }
  const syncY = () => obstacles.forEach(o => { o.y = GY - o.lift - o.h; });

  // ---------- Hits ----------
  function box() { const d = dino.duck && dino.y === 0, w = d ? DW * 1.3 : DW, h = d ? DH * .6 : DH;
    const b = { x: DX() + 8, y: GY - dino.y - h + 6, w: w - 16, h: h - 10 }, px = DX() + DW / 2, fy = GY - dino.y;   // scale the hitbox about the feet, like the sprite
    return { x: px + (b.x - px) * sizeV, y: fy - (fy - b.y) * sizeV, w: b.w * sizeV, h: b.h * sizeV }; }
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  function hurt(x, y) {
    if (inv > 0 || fever > 0) return true;
    if (shield) { shield = false; inv = 1; shake = .3; beep(300, .25, 'sawtooth'); burst(x, y, 24, 300, '#7fe0ff'); say(DX(), GY - 90, 'Shield broke!', '#7fe0ff'); return true; }
    die(); return false;
  }
  function die() {
    state = 'over'; overAt = performance.now(); shake = .6;
    beep(150, .4, 'sawtooth', .07); burst(DX() + DW / 2, GY - dino.y - 25, 40, 360, SCENES[scene].body);
    if (Math.floor(score) > hi) { hi = Math.floor(score); saveHi(); newBest = true; }
  }

  // ---------- Update ----------
  function update(dt) {
    T += dt;
    parts = parts.filter(p => (p.life -= dt) > 0); parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; });
    floaters = floaters.filter(f => (f.t -= dt) > 0); floaters.forEach(f => { f.y -= 30 * dt; });
    if (shake > 0) shake -= dt; if (banner.t > 0) banner.t -= dt; if (wf < wfDur) wf += dt;
    if (blendT < 1) blendT = Math.min(1, blendT + dt / 2.4);
    vScene = blendT < .5 ? from : scene;                              // 'visual scene': switches at the middle of a cross-fade
    popT += dt;
    sizeV += (1 + SIZE_STEP * Math.min(MAX_GROW, evoLv) - sizeV) * Math.min(1, dt * 7);   // smooth growth; hitbox + sprite both use sizeV
    if (ring >= 0 && (ring += dt) > .6) ring = -1;
    const tg = SCENES[scene].c, k = Math.min(1, dt * 1.5), run = state === 'run';
    cur.forEach((a, i) => a.forEach((v, j) => { a[j] += (tg[i][j] - v) * k; }));
    weather.forEach(p => {
      if (vScene === 1) { p.x -= (30 + (run ? speed * .2 : 0)) * dt; p.y += (25 + p.v * 30) * dt; p.x += Math.sin(p.ph + T * 2) * 20 * dt; if (p.x < -10 || p.y > H) { p.x = W + rnd(0, 60); p.y = rnd(-30, GY * .5); } }
      else if (vScene === 2) { p.x -= (20 + (run ? speed * .1 : 0)) * dt; p.y -= (30 + p.v * 60) * dt; p.x += Math.sin(p.ph + T * 3) * 15 * dt; if (p.y < -10 || p.x < -10) { p.x = rnd(0, W); p.y = H + rnd(0, 30); } }
      else if (vScene === 3) { p.x -= (run ? speed * .25 : 60) * dt; p.y += (500 + p.v * 300) * dt; if (p.y > H || p.x < -10) { p.x = rnd(0, W + 200); p.y = rnd(-100, 0); } }
      else if (vScene === 4) { p.x -= (20 + (run ? speed * .12 : 0)) * dt; p.y += (30 + p.v * 50) * dt; p.x += Math.sin(p.ph + T) * 25 * dt; if (p.y > H || p.x < -10) { p.x = rnd(0, W + 40); p.y = rnd(-30, 0); } }

    const cx = W / 2, by = GY + Math.min(62, (H - GY) * .5);
    if (state === 'over') {
      const oy = Math.max(70, GY * .38);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '6px';
      text('GAME OVER', cx + 3, oy, 30, tc()); if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      text(`Score ${Math.floor(score)}` + (coinCount ? `   ·   Coins ${coinCount}` : '') + (newBest ? '   ·   New best!' : ''), cx, oy + 32, 18, tc());
      text(`Scene: ${SCENES[scene].n}   ·   Features unlocked: ${nextU} of ${UNLOCKS.length}`, cx, oy + 56, 14, tc(.8), 'center', 'normal');
    }
    if (state === 'ready') {
      const oy = Math.max(70, GY * .38); if ('letterSpacing' in ctx) ctx.letterSpacing = '6px';
      text('DINO SAMURAI WORLDS', cx + 3, oy, 28, tc()); if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      text('X E N E S I S   ·   TECH FEST   |   CSE', cx, oy + 28, 13, tc(.75), 'center', 'normal');
    }
    if (state === 'idle' || state === 'over' || state === 'ready') {
      text(state === 'idle' ? 'Press space to play' : state === 'ready' ? 'Press SPACE or click to start' : 'Press space to play again', cx, by, 22, tg(state === 'ready' ? .65 + .35 * Math.sin(T * 4) : .9));
      text('Space / ↑ jump  ·  ↓ duck  ·  F fullscreen  ·  tap to jump', cx, by + 26, 13, tg(.65), 'center', 'normal');
      text('A new feature every 100 points. The world changes every 199.', cx, by + 46, 13, tg(.65), 'center', 'normal');
    }
  }

  let lastT = performance.now();
  function recover() {                                               // a drawing/logic error must never freeze the game
    canvas.width = canvas.width; ctx.setTransform(dpr * VS, 0, 0, dpr * VS, 0, 0);   // also clears any unbalanced save() stack
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.setLineDash([]);
    camY = 0; wz = 1; spFade = 0;
    if (state === 'space') { try { endSpace(); } catch (e) { state = 'run'; spData = null; } }
    if (++errN > 60 && state === 'run') { state = 'over'; overAt = performance.now(); errN = 0; }
  }
  (function frame(t) {
    requestAnimationFrame(frame);                                    // schedule first: the loop can never die
    const dt = Math.min(Math.max((t - lastT) / 1000, 0), .05); lastT = t;
    try {
      if (state === 'intro') { introT += dt; drawIntro(); if (introT >= INTRO_END) { state = 'ready'; readyAt = performance.now(); fadeIn = -.15; } }   // intro ends -> wait for the player
      else { update(dt); draw(); if (fadeIn < .8) { fadeIn += dt; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${Math.min(1, Math.max(0, 1 - fadeIn / .8))})`; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore(); } }
    } catch (err) { console.error(err); recover(); }
    const hide = state === 'run' || state === 'space';               // keep the screen clear while playing
    if (hide !== fsHidden) { fsHidden = hide; fsBtn.style.opacity = hide ? '0' : '1'; fsBtn.style.pointerEvents = hide ? 'none' : 'auto'; }
  })(lastT);
})();
</script>
</body>
