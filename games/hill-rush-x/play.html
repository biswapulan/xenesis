<script>
(() => {
'use strict';
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const fsBtn = document.getElementById('fs'), backBtn = document.getElementById('back');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W = 640, H = 360, VS = 1;
const FONT = 'system-ui, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  const w = innerWidth, h = innerHeight, s = Math.min(h / 360, w / 640);
  VS = s; W = w / s; H = h / s;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
}
addEventListener('resize', resize); resize();

/* ================= THEMES =================
   The first 8 are the Dino x Samurai worlds, the last 6 are new.
   g = gravity, grip = tyre grip, orb = sun/moon/earth, dec = background scenery, par = ambient particles */
const THEMES = [
 { n:'Classic',        sky:['#f7f7f7','#f7f7f7'], orb:'#e4e4e4', far:'#ececec', mid:'#dcdcdc', gTop:'#535353', gFill:'#ebebeb', gDeep:'#dadada', ink:'#535353', acc:'#535353', car:'#535353', dec:'cactus',  par:'none',   g:1,   grip:1,   o:'none', cloud:1 },
 { n:'Samurai Dawn',   sky:['#ffd1a8','#ff8a7a'], orb:'#ff3b3b', far:'#b46b8a', mid:'#8a4f70', gTop:'#f2c14e', gFill:'#3b2a3a', gDeep:'#2b1b1f', ink:'#2b1b1f', acc:'#f2c14e', car:'#4fae6a', dec:'torii',   par:'petal',  g:1,   grip:1,   o:'sun',  cloud:1 },
 { n:'Volcano Shrine', sky:['#2b0a0a','#b8360f'], orb:'#ffb347', far:'#3a1010', mid:'#561810', gTop:'#ff8a1a', gFill:'#1c0707', gDeep:'#150606', ink:'#150606', acc:'#ff8a1a', car:'#d9532b', dec:'volcano', par:'ember',  g:1,   grip:.95, o:'sun' },
 { n:'Neon Tokyo',     sky:['#14052e','#ff2f9a'], orb:'#35f0ff', far:'#2a0f5a', mid:'#1c0a45', gTop:'#35f0ff', gFill:'#0b0220', gDeep:'#07011a', ink:'#0b0220', acc:'#35f0ff', car:'#4a5cff', dec:'city',    par:'rain',   g:1,   grip:1,   o:'sun' },
 { n:'Winter Shrine',  sky:['#b7d7ee','#e4f1fa'], orb:'#ffffff', far:'#8fa9c4', mid:'#b5c9dc', gTop:'#ffffff', gFill:'#eef5fa', gDeep:'#cfe0ee', ink:'#2f4b66', acc:'#6fb3e0', car:'#4f9fd6', dec:'pine',    par:'snow',   g:1,   grip:.55, o:'sun',  cloud:1 },
 { n:'Moonlit Ninja',  sky:['#050b1a','#1c2d4f'], orb:'#fff6d0', far:'#0f1d33', mid:'#16294a', gTop:'#9fe6c0', gFill:'#0a1020', gDeep:'#070c18', ink:'#a9d9c4', acc:'#9fe6c0', car:'#3a4a8a', dec:'bamboo',  par:'firefly',g:1,   grip:1,   o:'moon', stars:1 },
 { n:'Great Wave',     sky:['#fdf0d5','#8cc3e0'], orb:'#fff3c0', far:'#2b5f8a', mid:'#1f4d78', gTop:'#e8f6ff', gFill:'#14365c', gDeep:'#0e2a47', ink:'#0e2a47', acc:'#e8f6ff', car:'#e0873a', dec:'wave',    par:'spray',  g:1,   grip:.9,  o:'sun',  cloud:1 },
 { n:'Xenesis',        sky:['#060001','#4a0710'], orb:'#ff2a3a', far:'#2a0509', mid:'#3a070d', gTop:'#ff3b4a', gFill:'#0c0102', gDeep:'#0a0102', ink:'#0a0102', acc:'#ff3b4a', car:'#d4202f', dec:'xmark',   par:'ember',  g:1,   grip:1,   o:'sun',  stars:1 },
 { n:'Sakura Meadow',  sky:['#ffe3ef','#bfe6ff'], orb:'#fff6c8', far:'#e8b4cc', mid:'#d596b8', gTop:'#7fd05a', gFill:'#5aa845', gDeep:'#468a37', ink:'#2d5a26', acc:'#ff8fb8', car:'#ff7aa8', dec:'sakura',  par:'petal',  g:1,   grip:1.05,o:'sun',  cloud:1 },
 { n:'Bamboo Grove',   sky:['#d9f2d0','#7fcf9a'], orb:'#fffbd0', far:'#5fa37a', mid:'#3f8a5f', gTop:'#2f7a45', gFill:'#6a5a3a', gDeep:'#53452c', ink:'#1f4a2c', acc:'#c8f27a', car:'#e8c34a', dec:'bamboo',  par:'leaf',   g:1,   grip:1,   o:'sun',  cloud:1 },
 { n:'Golden Dunes',   sky:['#ffe9b0','#ff9f5a'], orb:'#fff1c0', far:'#e0a060', mid:'#cf8a4a', gTop:'#f6d98a', gFill:'#e0b060', gDeep:'#c99440', ink:'#5a3410', acc:'#fff1c0', car:'#c2412b', dec:'dune',    par:'sand',   g:1,   grip:.8,  o:'sun' },
 { n:'Autumn Maple',   sky:['#ffd9a0','#e8785a'], orb:'#ffe6a8', far:'#a85a3a', mid:'#8a3f2a', gTop:'#e8892a', gFill:'#5a3022', gDeep:'#43241a', ink:'#3a1a10', acc:'#ffb347', car:'#e8b830', dec:'maple',   par:'leaf',   g:1,   grip:.95, o:'sun',  cloud:1 },
 { n:'Aurora Peak',    sky:['#04101f','#0f5a5a'], orb:'#e8fff8', far:'#0d3a4a', mid:'#14566a', gTop:'#baf5ff', gFill:'#0f2a3a', gDeep:'#0a1e2c', ink:'#baf5ff', acc:'#7affd0', car:'#3fe0b0', dec:'pine',    par:'snow',   g:1,   grip:.6,  o:'moon', stars:1, aurora:1 },
 { n:'Lunar X',        sky:['#000008','#10102a'], orb:'#4a8cff', far:'#2a2a3e', mid:'#3a3a52', gTop:'#e0e0f0', gFill:'#7a7a92', gDeep:'#5e5e76', ink:'#e0e0f0', acc:'#ff3b4a', car:'#c0c8ff', dec:'crater',  par:'dust',   g:.45, grip:.9,  o:'earth',stars:1 }
];
const NT = THEMES.length;
const KEYS = ['sky0','sky1','orb','far','mid','gTop','gFill','gDeep','ink','acc','car'];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
THEMES.forEach(t => { t.s0 = t.sky[0]; t.s1 = t.sky[1]; t.rgb = {}; KEYS.forEach(k => { t.rgb[k] = hex(t[k === 'sky0' ? 's0' : k === 'sky1' ? 's1' : k]); }); });
const mixRgb = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const css = (c, a) => a == null ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ================= STATE ================= */
const PXM = 20, STAGE_M = 500;
let state = 'menu', menuTheme = 1, tFrom = 1, tTo = 1, tt = 1, startTheme = 1;
const C = {};         // blended colours (rgb arrays)
let grav = 1, grip = 1, alphaStars = 0, alphaCloud = 0;
let hi = 0; try { hi = +localStorage.getItem('hill-rush-x-hi') || 0; } catch (e) {}
const saveHi = () => { try { localStorage.setItem('hill-rush-x-hi', hi); } catch (e) {} };
let showHud = true, muted = false, camLeft = 0, camTop = 0, camVx = 0, shake = 0, time = 0;
const keys = { gas: false, brake: false }, ptr = new Map();

/* ================= TERRAIN ================= */
function ramps(x) {
  if (x < 1500) return 0;
  const k0 = Math.floor((x - 1500) / 1100); let lift = 0;
  for (let k = k0 - 1; k <= k0 + 1; k++) {
    if (k < 0 || hash(k + 3) < .3) continue;
    const rx = 1500 + k * 1100 + (hash(k + 7) - .5) * 380, len = 260 + hash(k + 1) * 160;
    const Hh = 36 + hash(k + 5) * 34 + Math.min(30, rx / 900);
    const u = (x - rx) / len, dr = 130 / len;
    if (u < 0) continue;
    if (u <= 1) lift += Hh * Math.pow(u, 1.25); else if (u < 1 + dr) lift += Hh * (1 - sstep(0, 1, (u - 1) / dr));
  }
  return lift;
}
function terr(x) {
  const ramp = sstep(250, 1700, x), D = Math.min(1, x / 40000), A = 26 + 20 * D;
  const y = -0.04 * x - ramp * (95 * Math.sin(x / 950 + .6) + A * Math.sin(x / 330 + 1.3) + A * .32 * Math.sin(x / 121 + 2.1)) - ramps(x);
  return y + 105 * Math.sin(.6) * ramp * 0 ;
}
const slope = x => (terr(x + 1.5) - terr(x - 1.5)) / 3;

/* ================= PICKUPS ================= */
const CH = 400, chunks = new Map();
function chunk(i) {
  let c = chunks.get(i); if (c) return c; c = []; chunks.set(i, c);
  if (i < 2) return c;
  if (hash(i * 3 + 1) < .72) {
    const n = 3 + Math.floor(hash(i * 3 + 2) * 5), sx = i * CH + 40 + hash(i * 5) * 120, ah = hash(i * 7) * 46, big = hash(i * 11) < .14;
    for (let k = 0; k < n; k++) { const x = sx + k * 38; c.push({ t: big ? 'big' : 'coin', x, y: terr(x) - 34 - ah * Math.sin(k / Math.max(1, n - 1) * Math.PI), got: false }); }
  }
  if (i % 6 === 3) { const x = i * CH + 180; c.push({ t: 'fuel', x, y: terr(x) - 30, got: false }); }
  return c;
}

/* ================= CAR ================= */
const GRAV = 1500, INERTIA = 2000, WR = 16, LMAX = 24, LMIN = 6, CMAX = LMAX - LMIN, KS = 107, CD = 12, KH = 1500;
const ENG = 400, VMAX = 540, BRK = 900, REV = 260, VREV = 240, AIR = 9;
const WX = [-38, 38], WY = 10;
const BODY = [[-52, 4], [52, 4], [-34, -22], [34, -22], [0, -22], [0, 14], [-50, -8], [50, -8]];
const HEAD = [-6, -42];
const car = { x: 0, y: 0, a: 0, vx: 0, vy: 0, w: 0, wh: [{ c: 6, spin: 0, gnd: false }, { c: 6, spin: 0, gnd: false }] };
let run = null;

function newRun() {
  const sx = 220; car.x = sx; car.y = terr(sx) - 38; car.a = Math.atan(slope(sx)); car.vx = 0; car.vy = 0; car.w = 0;
  car.wh.forEach(w => { w.c = 6; w.spin = 0; w.gnd = false; });
  run = { sx, dist: 0, maxDist: 0, coins: 0, fuel: 100, bonus: 0, air: 0, rot: 0, airPrev: false, slow: 0, stage: 0, why: '', t: 0, lines: [], banner: null, parts: [], pop: [], headT: 0, roofT: 0, gasOn: false };
  chunks.clear();
  run.banner = { t: 3.2, title: 'STAGE 1', sub: THEMES[startTheme].n };
}
newRun();

function loc(lx, ly) { const ca = Math.cos(car.a), sa = Math.sin(car.a); return [car.x + lx * ca - ly * sa, car.y + lx * sa + ly * ca]; }

function physics(dt, gas, brake) {
  const g = GRAV * grav, ca = Math.cos(car.a), sa = Math.sin(car.a);
  let fx = 0, fy = g, tq = 0, grounded = 0;
  const dx = -sa, dy = ca;               // chassis "down"
  for (let i = 0; i < 2; i++) {
    const wh = WX[i], w = car.wh[i], rax = wh * ca - WY * sa, ray = wh * sa + WY * ca;
    const Ax = car.x + rax, Ay = car.y + ray, Wx = Ax + dx * LMAX, Wy = Ay + dy * LMAX;
    let best = null;
    const hc = terr(Wx);
    if (Wy > hc) {                        // centre below surface
      const s = slope(Wx), nl = Math.sqrt(1 + s * s);
      best = { pen: WR + (Wy - hc) / nl, nx: s / nl, ny: -1 / nl, px: Wx, py: hc };
    } else {
      for (const o of [-WR * .7, 0, WR * .7]) {
        const px = Wx + o, py = terr(px), ex = Wx - px, ey = Wy - py, d = Math.hypot(ex, ey);
        if (d < WR && d > 1e-4) { const pen = WR - d; if (!best || pen > best.pen) best = { pen, nx: ex / d, ny: ey / d, px, py }; }
      }
    }
    w.gnd = false;
    if (!best) { w.c += (0 - w.c) * Math.min(1, dt * 14); continue; }
    const ux = sa, uy = -ca, nu = Math.max(.35, best.nx * ux + best.ny * uy);
    const cRaw = best.pen / nu, c = Math.min(cRaw, CMAX);
    w.c = c; w.gnd = true; grounded++;
    const vAx = car.vx - car.w * ray, vAy = car.vy + car.w * rax, vn = vAx * best.nx + vAy * best.ny;
    let N = KS * c + (cRaw > CMAX ? KH * (cRaw - CMAX) : 0) - CD * vn; if (N < 0) N = 0;
    fx += best.nx * N; fy += best.ny * N; tq += rax * best.ny * N - ray * best.nx * N;
    // contact point + traction
    const tx = -best.ny, ty = best.nx, Pcx = Wx - dx * (LMAX - c) * 0 - best.nx * WR + (-dx * (LMAX - c)) * 0;
    const wcx = Ax + dx * (LMAX - c), wcy = Ay + dy * (LMAX - c);
    const pcx = wcx - best.nx * WR, pcy = wcy - best.ny * WR;
    const rcx = pcx - car.x, rcy = (pcy - car.y) * .55;       // applied nearer the centre of mass: gentler wheelies
    const vCx = car.vx - car.w * rcy, vCy = car.vy + car.w * rcx, vt = vCx * tx + vCy * ty;
    const lim = grip * 1.15 * N;
    let F = 0;
    if (gas) F = ENG * (1 - clamp(vt / VMAX, 0, 1.2));
    else if (brake) { if (vt > 12) F = -Math.min(BRK, 60 * vt); else F = -REV * (1 - clamp(-vt / VREV, 0, 1)); }
    else F = -clamp(vt * 1.2, -60, 60);
    if (gas && brake) F = -Math.min(BRK, 60 * vt);
    F = clamp(F, -lim, lim);
    fx += tx * F; fy += ty * F; tq += rcx * ty * F - rcy * tx * F;
    w.spin += (vt / WR) * dt;
  }
  if (grounded < 2) {
    const dir = (brake ? 1 : 0) - (gas ? 1 : 0); car.w += dir * AIR * (grounded ? .45 : 1) * dt;
    if (!grounded) car.w -= car.w * .15 * dt;
    if (!grounded) car.wh.forEach(w => { w.spin += (gas ? 26 : brake ? 0 : 8) * dt; });
  }
  car.vx += fx * dt; car.vy += fy * dt; car.w += tq / INERTIA * dt; car.w = clamp(car.w, -11, 11);
  const sp = Math.hypot(car.vx, car.vy); if (sp > 1500) { car.vx *= 1500 / sp; car.vy *= 1500 / sp; }
  car.x += car.vx * dt; car.y += car.vy * dt; car.a += car.w * dt;
  // body vs ground
  let roof = false;
  for (let b = 0; b < BODY.length; b++) {
    const [px, py] = loc(BODY[b][0], BODY[b][1]), h = terr(px);
    if (py > h) {
      const s = slope(px), nl = Math.sqrt(1 + s * s), nx = s / nl, ny = -1 / nl, pen = (py - h) / nl;
      car.x += nx * pen; car.y += ny * pen;
      const rx = px - car.x, ry = py - car.y, vpx = car.vx - car.w * ry, vpy = car.vy + car.w * rx, vn = vpx * nx + vpy * ny;
      if (vn < 0) {
        const rn = rx * ny - ry * nx, j = -vn * 1.12 / (1 + rn * rn / INERTIA);
        car.vx += nx * j; car.vy += ny * j; car.w += rn * j / INERTIA;
        const tx = -ny, ty = nx, vt = vpx * tx + vpy * ty, rt = rx * ty - ry * tx;
        const jt = clamp(-vt / (1 + rt * rt / INERTIA), -.4 * j, .4 * j);
        car.vx += tx * jt; car.vy += ty * jt; car.w += rt * jt / INERTIA;
        if (-vn > 260) shake = Math.max(shake, Math.min(6, -vn / 120));
      }
      if (b >= 2 && b <= 4) roof = true;
    }
  }
  return { grounded, roof };
}

/* ================= AUDIO ================= */
let AC = null, eng = null, engG = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth'; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    engG = AC.createGain(); engG.gain.value = 0; eng.connect(f); f.connect(engG); engG.connect(AC.destination); eng.start();
  } catch (e) { AC = null; }
}
function blip(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function engineSound() {
  if (!AC || !eng) return;
  const on = state === 'play' && !muted && run && run.fuel > 0;
  const sp = Math.hypot(car.vx, car.vy);
  eng.frequency.value = 48 + sp * .085 + (run && run.gasOn ? 16 : 0);
  engG.gain.value += ((on ? .03 + (run.gasOn ? .018 : 0) : 0) - engG.gain.value) * .2;
}

/* ================= GAME LOGIC ================= */
function setStage(n) {
  run.stage = n; const to = (startTheme + n) % NT;
  tFrom = tTo; tTo = to; tt = 0;
  run.banner = { t: 3.2, title: 'STAGE ' + (n + 1), sub: THEMES[to].n };
  blip(520, 880, .35, 'triangle', .07);
}
function popText(txt, col) { run.lines.push({ txt, col, t: 2.4 }); if (run.lines.length > 4) run.lines.shift(); }
function addParts(x, y, n, o) { for (let i = 0; i < n; i++) run.parts.push({ x, y, vx: (o.vx || 0) + (Math.random() - .5) * o.sp, vy: (o.vy || 0) - Math.random() * o.up, life: 0, max: o.life * (.6 + Math.random() * .6), r: o.r * (.6 + Math.random() * .8), col: o.col, g: o.g == null ? 300 : o.g }); }
function gameOver(why) {
  if (state !== 'play') return; state = 'over'; run.why = why;
  const sc = score(); if (sc > hi) { hi = sc; saveHi(); run.newBest = true; }
  addParts(car.x, car.y - 10, 26, { sp: 360, up: 260, life: 1, r: 4, col: '#ffb347' }); shake = 8; blip(220, 40, .5, 'sawtooth', .12);
}
const score = () => Math.floor(run.maxDist) * 10 + run.coins * 25 + run.bonus;
function startRun() {
  startTheme = menuTheme; tFrom = tTo = startTheme; tt = 1; newRun(); state = 'play'; audioInit();
  camLeft = car.x - W * .3; camTop = car.y - H * .55;
}

function update(dt) {
  time += dt;
  if (tt < 1) tt = Math.min(1, tt + dt / 3);
  const k = tt * tt * (3 - 2 * tt), A = THEMES[tFrom], B = THEMES[tTo];
  KEYS.forEach(key => { C[key] = mixRgb(A.rgb[key], B.rgb[key], k); });
  grav = lerp(A.g, B.g, k); grip = lerp(A.grip, B.grip, k);
  alphaStars = lerp(A.stars ? 1 : 0, B.stars ? 1 : 0, k); alphaCloud = lerp(A.cloud ? 1 : 0, B.cloud ? 1 : 0, k);
  if (state === 'menu') { tFrom = tTo = menuTheme; tt = 1; }
  const gas = state === 'play' && (keys.gas || [...ptr.values()].includes('g')), brake = state === 'play' && (keys.brake || [...ptr.values()].includes('b'));
  if (state === 'play' || state === 'over' || state === 'menu') {
    const steps = 3, h = dt / steps;
    let info = { grounded: 0, roof: false };
    for (let s = 0; s < steps; s++) info = physics(h, state === 'play' && run.fuel > 0 ? gas : false, state === 'play' ? brake : false);
    if (state === 'play') gameplay(dt, gas, brake, info);
  }
  if (run) { run.gasOn = gas && run.fuel > 0; run.t += dt; }
  // camera
  const ahead = clamp(car.vx * .12, -20, 120);
  camLeft += (car.x - W * .3 - ahead - camLeft) * Math.min(1, dt * 6);
  camTop += (car.y - H * .56 - camTop) * Math.min(1, dt * 3.2);
  shake *= Math.pow(.02, dt);
  if (run) {
    if (run.banner) { run.banner.t -= dt; if (run.banner.t <= 0) run.banner = null; }
    run.lines.forEach(l => l.t -= dt); run.lines = run.lines.filter(l => l.t > 0);
    run.parts.forEach(p => { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }); run.parts = run.parts.filter(p => p.life < p.max);
  }
  ambient(dt);
  engineSound();

}

/* ================= HUD ================= */
function text(s, x, y, size, col, align, stroke, weight) {

}
function gauge(cx, cy, r, v, label, zones) {

const btn = { l: null, r: null, go: null, pause: null };

  text('SCORE', 62, 22, 8.5, 'rgba(255,255,255,.8)', 'center', null, 700); text(String(sc), 62, 44, 22, '#fff', 'center', '#0b1020');
  ctx.fillStyle = 'rgba(10,14,28,.55)'; rr(8, 58, 84, 22, 11); ctx.fill(); ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(22, 69, 7, 0, TAU); ctx.fill(); ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.6; ctx.stroke(); text(String(run.coins), 36, 75, 13, '#fff', 'left', '#0b1020');

/* ================= MENUS ================= */

  text((menuTheme + 1) + ' / ' + NT, cx, y + 38, 9.5, 'rgba(255,255,255,.6)', 'center', null, 700);

  text('Best  ' + hi, cx, H * .06 + H * .88 - 24, 12, '#fff', 'center', null, 700);

function overScreen() {

  text(String(score()), cx, H * .14 + 92, 44, '#fff', 'center', '#0b1020'); text(run.newBest ? 'NEW BEST!' : 'SCORE', cx, H * .14 + 108, 10.5, run.newBest ? '#7affd0' : 'rgba(255,255,255,.7)', 'center', null, 800);

/* ================= RENDER ================= */
function render() {
  ctx.setTransform(dpr * VS, 0, 0, dpr * VS, 0, 0);

  for (let i = c0; i <= c1; i++) chunk(i).forEach(it => {
    if (it.got) return; const bob = Math.sin(time * 4 + it.x * .05) * 2.2;
    if (it.t === 'fuel') { ctx.fillStyle = '#d8342a'; ctx.strokeStyle = '#2a0a08'; ctx.lineWidth = 2; rr(it.x - 11, it.y - 13 + bob, 22, 26, 4); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillRect(it.x - 6, it.y - 8 + bob, 12, 7); ctx.fillStyle = '#2a0a08'; ctx.fillRect(it.x - 5, it.y - 17 + bob, 8, 4); ctx.fillStyle = '#d8342a'; text('F', it.x, it.y + 9 + bob, 9, '#fff', 'center', null); }

  if (state === 'over') { hud(); overScreen(); }

}

/* ================= INPUT ================= */
const inRect = (p, r) => r && p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];

  if (state === 'menu') { if (inRect(p, btn.l)) cycle(-1); else if (inRect(p, btn.r)) cycle(1); else if (inRect(p, btn.go)) startRun(); }
  else if (state === 'over') { if (inRect(p, btn.go)) startRun(); else if (p.y < 60 && p.x < 120) {} }

  if (state === 'pause') { state = 'play'; return; }
  if (k === 'ArrowRight' || k === 'ArrowUp' || k === 'd' || k === 'D' || k === 'w' || k === 'W') keys.gas = true;
  if (k === 'ArrowLeft' || k === 'ArrowDown' || k === 'a' || k === 'A' || k === 's' || k === 'S') keys.brake = true;
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowUp' || k === 'd' || k === 'D' || k === 'w' || k === 'W') keys.gas = false;
  if (k === 'ArrowLeft' || k === 'ArrowDown' || k === 'a' || k === 'A' || k === 's' || k === 'S') keys.brake = false;

function toggleFs() { const d = document, el = d.documentElement; if (!d.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); else (d.exitFullscreen || d.webkitExitFullscreen || (() => {})).call(d); }

/* ================= LOOP ================= */

update(.016); camLeft = car.x - W * .3; camTop = car.y - H * .56;
requestAnimationFrame(frame);

/* test hook */
