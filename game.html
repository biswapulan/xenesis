<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X Games · XENESIS 4.0</title><meta name="theme-color" content="#0b0f12">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=5">
<style>
main.gpw{max-width:1180px;min-width:0}.gp>*,.about{min-width:0}
.crumb{font-size:12px;opacity:.75;margin:4px 0 8px}.crumb a{color:inherit;text-decoration:none}.crumb a:hover{color:var(--amber)}.crumb i{font-style:normal;margin:0 6px;opacity:.6}
.tb{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.tb h1{font-size:clamp(24px,5vw,36px);letter-spacing:.08em;text-align:left;text-transform:none}
.tb .back{border:1px solid rgba(232,228,218,.3);padding:9px 16px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:inherit;text-decoration:none;background:rgba(11,15,18,.6)}
.tb .back:hover{border-color:var(--amber);color:var(--amber)}
.tb .acts{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.tb .playbtn{display:flex;align-items:center;justify-content:center;padding:12px 30px;font-size:12px;letter-spacing:.2em}
@media (max-width:600px){.tb .acts{width:100%}.tb .playbtn{flex:1}}
.gp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.panel{background:linear-gradient(180deg,rgba(11,15,18,.66),rgba(11,15,18,.88));border:1px solid rgba(232,228,218,.14);backdrop-filter:blur(3px)}
.viewer{position:relative;aspect-ratio:16/9;background:#000;border:1px solid rgba(232,228,218,.14);overflow:hidden}
.viewer video,.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer;opacity:0;transition:opacity .25s;z-index:2}
.viewer:hover .arr,.arr:focus-visible{opacity:1}.arr.l{left:0}.arr.r{right:0}.arr:hover{background:rgba(176,32,42,.8)}
@media (hover:none){.arr{opacity:.85}}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--crim) transparent}
.th{position:relative;flex:0 0 auto;width:120px;aspect-ratio:16/9;padding:0;border:2px solid transparent;background:#000;cursor:pointer;opacity:.66;transition:.2s}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th:hover{opacity:1}.th.on{opacity:1;border-color:var(--amber)}
.th .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;text-shadow:0 0 8px #000;background:rgba(0,0,0,.25)}
.side{display:flex;flex-direction:column;overflow:hidden}
.side .cap{display:block;width:100%;height:auto;aspect-ratio:920/430;object-fit:cover;border-bottom:1px solid rgba(232,228,218,.14)}
.side .bd{padding:18px 20px 20px}
.side .short{font-size:13.5px;line-height:1.65;opacity:.9}
.meta{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:18px 0 16px;font-size:12.5px}
.meta dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;padding-top:2px}
.meta dd{margin:0;color:var(--amber)}
.tagl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tg{background:rgba(217,161,91,.14);border:1px solid rgba(217,161,91,.35);color:var(--amber);padding:4px 10px;font-size:11.5px}
.playbtn{display:block;text-align:center;padding:14px 10px;font-size:12px;letter-spacing:.2em}
.about{margin-top:22px;padding:26px clamp(18px,3vw,34px) 30px}
.about h2{font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.about h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:26px 0 12px}
.about p{font-size:14px;line-height:1.8;opacity:.9;margin:12px 0;max-width:80ch}
.about ul{list-style:none;padding:0;margin:0;max-width:80ch}
.about li{position:relative;padding:0 0 10px 26px;font-size:14px;line-height:1.7;opacity:.92}
.about li::before{content:"✦";position:absolute;left:0;top:1px;color:var(--amber);font-size:12px}
.ctl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0;max-width:80ch;border:1px solid rgba(232,228,218,.14)}
.ctl b,.ctl span{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(232,228,218,.1)}
.ctl b{background:rgba(232,228,218,.05);font-weight:600;color:var(--amber)}
.ctl b:nth-last-child(2),.ctl span:last-child{border-bottom:0}
.nf{text-align:center;padding:60px 10px}
@media (max-width:900px){.gp{grid-template-columns:minmax(0,1fr)}.th{width:104px}}
.tt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag2{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:10.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.tag2.nw{background:var(--crim);color:#fff;border:1px solid rgba(255,255,255,.35)}
.tag2.ht{color:#2b1a00;background:linear-gradient(110deg,#a8741a 0%,#f7d774 28%,#fff3b8 45%,#e2a92f 62%,#a8741a 100%);background-size:220% 100%;border:1px solid #fff1b0;box-shadow:0 3px 14px rgba(226,169,47,.5);animation:shine 3.2s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
@media (prefers-reduced-motion:reduce){.tag2.ht{animation:none}}
</style></head>
<body data-page="games.html">
<div class="app"><main class="gpw" id="root"></main></div>
<script src="shared.js?v=5"></script>
<script src="games-data.js"></script>
<script src="games-track.js"></script>
<script>
(function(){
  var root=document.getElementById('root');
  var id=new URLSearchParams(location.search).get('id');
  var G=(window.XEN_GAMES||[]).filter(function(x){return x.id===id})[0];
  function el(tag,cls,txt,kids){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; (kids||[]).forEach(function(k){e.appendChild(k)}); return e;}
  if(!G){ root.appendChild(el('div','nf in',null,[el('h1','','Game not found'),el('p','','That game is not in the X Games library.'),
      Object.assign(el('a','btn','Back to X Games'),{href:'games.html'})])); document.title='Game not found · X Games'; return; }
  document.title=G.title+' · X Games · XENESIS 4.0';

  /* breadcrumb + title bar */
  var crumb=el('nav','crumb in'); var a1=el('a','','X Games'); a1.href='games.html'; crumb.appendChild(a1); crumb.appendChild(el('i','','›')); crumb.appendChild(el('span','',G.title));
  var back=el('a','back','← All X Games'); back.href='games.html';
  var play=el('a','btn playbtn','▶  Play Now'); play.href=G.play;
  root.appendChild(crumb); var tt=el('div','tt',null,[el('h1','',G.title)]);
  if(window.XenGames&&G.new&&!window.XenGames.hasPlayed(G.id)) tt.appendChild(el('span','tag2 nw','New'));
  root.appendChild(el('div','tb in',null,[tt,el('div','acts',null,[back,play])]));
  if(window.XenGames) window.XenGames.stats().then(function(st){ if(window.XenGames.hits(window.XEN_GAMES,st)[G.id]) tt.appendChild(el('span','tag2 ht','\u2605 Hit')); });

  /* left: viewer + thumbnail strip (video first, then screenshots) */
  var items=[{type:'video',thumb:G.poster,alt:'Gameplay video'}].concat(G.shots.map(function(s){return {type:'img',src:s.src,thumb:s.thumb,alt:s.alt}}));
  var viewer=el('div','viewer'), strip=el('div','strip'), cur=-1, video=null;
  var bl=el('button','arr l','‹'), br=el('button','arr r','›'); bl.type=br.type='button'; bl.setAttribute('aria-label','Previous'); br.setAttribute('aria-label','Next');
  var thumbs=[];
  function show(i){
    i=(i+items.length)%items.length; if(i===cur) return; cur=i;
    Array.prototype.slice.call(viewer.querySelectorAll('video,img')).forEach(function(n){ if(n.tagName==='VIDEO'){n.pause();} n.remove(); });
    var it=items[i];
    if(it.type==='video'){
      video=document.createElement('video'); video.controls=true; video.muted=true; video.loop=true; video.autoplay=true; video.playsInline=true; video.preload='metadata'; video.poster=G.poster;
      var s=document.createElement('source'); s.src=G.video; s.type='video/mp4'; video.appendChild(s); if(G.videoWebm){var s2=document.createElement('source'); s2.src=G.videoWebm; s2.type='video/webm'; video.appendChild(s2);} viewer.insertBefore(video,viewer.firstChild);
      var p=video.play&&video.play(); if(p&&p.catch) p.catch(function(){});
    } else { var im=document.createElement('img'); im.src=it.src; im.alt=it.alt; viewer.insertBefore(im,viewer.firstChild); }
    thumbs.forEach(function(t,k){t.classList.toggle('on',k===i); if(k===i) t.setAttribute('aria-current','true'); else t.removeAttribute('aria-current');});
    var t=thumbs[i], l=t.offsetLeft-strip.offsetLeft-(strip.clientWidth-t.offsetWidth)/2; strip.scrollTo({left:l,behavior:'smooth'});
  }
  items.forEach(function(it,i){
    var b=el('button','th'); b.type='button'; b.setAttribute('aria-label',it.alt); var im=document.createElement('img'); im.src=it.thumb; im.alt=''; im.loading='lazy'; b.appendChild(im);
    if(it.type==='video') b.appendChild(el('span','pl','▶'));
    b.addEventListener('click',function(){show(i)}); thumbs.push(b); strip.appendChild(b);
  });
  bl.addEventListener('click',function(){show(cur-1)}); br.addEventListener('click',function(){show(cur+1)});
  viewer.appendChild(bl); viewer.appendChild(br);
  var left=el('div','in',null,[viewer,strip]);

  /* right: capsule banner, summary, details, tags, play */
  var meta=el('dl','meta'); [['Genre',G.genre],['Developer',G.developer],['Publisher',G.publisher],['Platform',G.platform],['Players',G.players]].forEach(function(r){meta.appendChild(el('dt','',r[0])); meta.appendChild(el('dd','',r[1]));});
  var tags=el('div','tags'); G.tags.forEach(function(t){tags.appendChild(el('span','tg',t))});
  var cap=document.createElement('img'); cap.className='cap'; cap.src=G.banner; cap.alt=G.title+' banner';
  var side=el('aside','panel side in',null,[cap,el('div','bd',null,[el('p','short',G.short),meta,el('div','tagl','Popular tags for this game'),tags])]);
  root.appendChild(el('div','gp',null,[left,side]));

  /* about, features, controls */
  var about=el('section','panel about in'); about.appendChild(el('h2','','About This Game')); about.appendChild(el('hr','blade'));
  G.about.forEach(function(t){about.appendChild(el('p','',t))});
  about.appendChild(el('h3','','Features')); var ul=el('ul'); G.features.forEach(function(t){ul.appendChild(el('li','',t))}); about.appendChild(ul);
  about.appendChild(el('h3','','How to play')); var ctl=el('div','ctl'); G.controls.forEach(function(r){ctl.appendChild(el('b','',r[0])); ctl.appendChild(el('span','',r[1]));}); about.appendChild(ctl);
  root.appendChild(about);
  show(0);
})();
</script>
</body></html>
