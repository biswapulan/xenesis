<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X Games · XENESIS 4.0</title><meta name="theme-color" content="#0b0f12">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<style>
.hd{text-align:center;padding:10px 0 6px}.hd h1{font-size:clamp(26px,6vw,46px)}.hd p{max-width:46ch;margin:12px auto 0;opacity:.85;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),380px));justify-content:center;gap:20px;margin-top:28px}
.gm{position:relative;display:flex;flex-direction:column;color:inherit;text-decoration:none;background:linear-gradient(180deg,rgba(11,15,18,.62),rgba(11,15,18,.86));border:1px solid rgba(232,228,218,.14);backdrop-filter:blur(3px);transition:.3s;overflow:hidden}
.gm:hover,.gm:focus-visible{border-color:var(--amber);transform:translateY(-3px);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(217,161,91,.18)}
.gm .th{display:block;width:100%;height:auto;aspect-ratio:920/430;object-fit:cover;border-bottom:1px solid rgba(232,228,218,.14)}
.gm .bd{display:flex;flex-direction:column;flex:1;padding:20px 22px 22px}
.grp{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);font-weight:600}
.gm h2{font-size:17px;margin:8px 0 10px;letter-spacing:.1em;text-transform:none}
.gm p.s{font-size:13.5px;opacity:.82;line-height:1.65;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px}
.chip{border:1px solid rgba(232,228,218,.3);padding:4px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.gm.soon{cursor:default;border-style:dashed;border-color:rgba(217,161,91,.35);background:linear-gradient(180deg,rgba(11,15,18,.5),rgba(11,15,18,.78))}
.gm.soon:hover{transform:none;border-color:rgba(217,161,91,.35);box-shadow:none}
.sk{position:relative;display:grid;place-items:center;aspect-ratio:920/430;border-bottom:1px dashed rgba(217,161,91,.3);overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(176,32,42,.45),rgba(11,15,18,.9) 70%)}
.sk b{font:700 clamp(56px,9vw,84px)/1 var(--min);color:rgba(217,161,91,.85);text-shadow:0 0 30px rgba(176,32,42,.7)}
.rib{position:absolute;top:14px;left:-34px;transform:rotate(-35deg);width:150px;text-align:center;padding:5px 0;background:var(--amber);color:#1c1008;font-size:9.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.gm.soon p.s{opacity:.7;margin-bottom:16px}
.soonbtn{display:flex;align-items:center;justify-content:center;padding:12px 10px;border:1px dashed rgba(217,161,91,.5);color:var(--amber);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.gm .btn{padding:12px 10px;font-size:10.5px;letter-spacing:.18em;text-align:center}
</style></head>
<body data-page="games.html">
<div class="app"><main>
 <section class="hd in"><h1>X Games<span class="kj" lang="ja">遊戯</span></h1><hr class="blade" style="width:min(260px,60%);margin:18px auto">
 <p>Take a break between events. Play the Xenesis arcade right here in your browser.</p></section>
 <div class="grid" id="grid"></div>
</main></div>
<script src="shared.js?v=3"></script>
<script src="games-data.js"></script>
<script>
(function(){
  var g=document.getElementById('grid');
  (window.XEN_GAMES||[]).forEach(function(x){
    var a=document.createElement('a'); a.className='gm in'; a.href='game.html?id='+encodeURIComponent(x.id);
    var img=document.createElement('img'); img.className='th'; img.src=x.banner; img.alt=x.title+' banner'; img.loading='lazy'; a.appendChild(img);
    var bd=document.createElement('div'); bd.className='bd';
    function add(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; e.textContent=txt; bd.appendChild(e); return e;}
    add('p','grp',x.genre); add('h2','',x.title); add('p','s',x.short);
    var c=document.createElement('div'); c.className='chips'; x.tags.slice(0,4).forEach(function(t){var s=document.createElement('span'); s.className='chip'; s.textContent=t; c.appendChild(s);}); bd.appendChild(c);
    var b=document.createElement('span'); b.className='btn'; b.textContent='View Game'; bd.appendChild(b);
    a.appendChild(bd); g.appendChild(a);
  });
  (window.XEN_SOON||[]).forEach(function(x){
    function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}
    var c=el('article','gm soon in'), sk=el('div','sk'); sk.setAttribute('aria-hidden','true'); sk.appendChild(el('span','rib','Coming Soon')); sk.appendChild(el('b','','?')); c.appendChild(sk);
    var bd=el('div','bd'); bd.appendChild(el('p','grp','Stay tuned')); bd.appendChild(el('h2','',x.title)); bd.appendChild(el('p','s',x.text)); bd.appendChild(el('div','soonbtn','Coming Soon')); c.appendChild(bd); g.appendChild(c);
  });
})();
</script>
</body></html>
