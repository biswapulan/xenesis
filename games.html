<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X Games · XENESIS 4.0</title><meta name="theme-color" content="#0b0f12">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=6">
<style>
.hd{text-align:center;padding:10px 0 6px}.hd h1{font-size:clamp(26px,6vw,46px)}.hd p{max-width:46ch;margin:12px auto 0;opacity:.85;font-size:14px}
main{max-width:1200px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
.gm{position:relative;display:flex;flex-direction:column;color:inherit;text-decoration:none;background:linear-gradient(180deg,rgba(11,15,18,.62),rgba(11,15,18,.86));border:1px solid rgba(232,228,218,.14);backdrop-filter:blur(3px);transition:.3s;overflow:hidden}
.gm:hover,.gm:focus-visible{border-color:var(--amber);transform:translateY(-3px);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(217,161,91,.18)}
.gm .th{display:block;width:100%;height:auto;aspect-ratio:920/430;object-fit:cover;border-bottom:1px solid rgba(232,228,218,.14)}
.gm .bd{display:flex;flex-direction:column;flex:1;padding:20px 22px 22px}
.grp{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);font-weight:600}
.gm h2{font-size:17px;margin:8px 0 10px;letter-spacing:.1em;text-transform:none}
.gm p.s{font-size:13.5px;opacity:.82;line-height:1.65;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px}
.chip{border:1px solid rgba(232,228,218,.3);padding:4px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.gm.soon{cursor:default;border-style:dashed;border-color:rgba(217,161,91,.35);background:linear-gradient(180deg,rgba(11,15,18,.5),rgba(11,15,18,.78))}
.gm.soon:hover{transform:none;border-color:rgba(217,161,91,.35);box-shadow:none}
.sk{position:relative;display:grid;place-items:center;aspect-ratio:920/430;border-bottom:1px dashed rgba(217,161,91,.3);overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(176,32,42,.45),rgba(11,15,18,.9) 70%)}
.sk b{font:700 clamp(56px,9vw,84px)/1 var(--min);color:rgba(217,161,91,.85);text-shadow:0 0 30px rgba(176,32,42,.7)}
.rib{position:absolute;top:14px;left:-34px;transform:rotate(-35deg);width:150px;text-align:center;padding:5px 0;background:var(--amber);color:#1c1008;font-size:9.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.gm.soon p.s{opacity:.7;margin-bottom:16px}
.soonbtn{display:flex;align-items:center;justify-content:center;padding:12px 10px;border:1px dashed rgba(217,161,91,.5);color:var(--amber);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.gm .btn{padding:12px 10px;font-size:10.5px;letter-spacing:.18em;text-align:center}

/* NEW highlight (shown for a few visits until the game is played) */
.gm.fresh{border-color:var(--amber);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(217,161,91,.55),0 0 22px rgba(217,161,91,.22)}50%{box-shadow:0 0 0 1px rgba(242,193,78,.95),0 0 44px rgba(242,193,78,.5)}}
.bdg{position:absolute;top:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:10.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;pointer-events:none}
.bdg.nw{right:12px;background:var(--crim);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(176,32,42,.55)}
.bdg.nw::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.bdg.ht{left:12px;color:#2b1a00;background:linear-gradient(110deg,#a8741a 0%,#f7d774 28%,#fff3b8 45%,#e2a92f 62%,#a8741a 100%);background-size:220% 100%;border:1px solid #fff1b0;box-shadow:0 4px 18px rgba(226,169,47,.6),inset 0 0 0 1px rgba(120,76,0,.35);animation:shine 3.2s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.gm.top{border-color:#e2a92f}
.nt{display:block;margin:-6px 0 14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600}
.cs{display:flex;justify-content:center;margin:34px 0 4px}
.cs a{border:1px solid rgba(217,161,91,.5);padding:12px 22px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--amber);text-decoration:none;background:rgba(11,15,18,.6)}
.cs a:hover{background:var(--amber);color:#1c1008}
.gm.soon{color:inherit;text-decoration:none}.gm.soon:hover{border-color:var(--amber)}
@media (prefers-reduced-motion:reduce){.gm.fresh,.bdg.ht,.bdg.nw::before{animation:none}}
</style></head>
<body data-page="games.html">
<div class="app"><main>
 <section class="hd in"><h1>X Games<span class="kj" lang="ja">遊戯</span></h1><hr class="blade" style="width:min(260px,60%);margin:18px auto">
 <p>Take a break between events. Play the Xenesis arcade right here in your browser.</p></section>
 <div class="grid" id="grid"></div>
</main></div>
<script src="shared.js?v=5"></script>
<script src="games-data.js"></script>
<script src="games-track.js"></script>
<script>
(function(){
  var g=document.getElementById('grid'), T=window.XenGames;
  function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}
  /* shown in the same order as the list in games-data.js */
  var games=(window.XEN_GAMES||[]).slice();
  var cards={};

  /* every visit counts once toward a NEW game's highlight limit; decide what to highlight from the count BEFORE this visit */
  var glow={}; games.forEach(function(x){glow[x.id]=T.isHighlighted(x)}); T.countVisit(games);

  games.forEach(function(x){
    var a=el('a','gm in'+(glow[x.id]?' fresh':'')); a.href='game.html?id='+encodeURIComponent(x.id); a.dataset.id=x.id;
    var img=el('img','th'); img.src=x.banner; img.alt=x.title+' banner'; img.loading='lazy'; a.appendChild(img);
    if(glow[x.id]) a.appendChild(el('span','bdg nw','New'));
    var bd=el('div','bd');
    bd.appendChild(el('p','grp',x.genre)); bd.appendChild(el('h2','',x.title));
    if(glow[x.id]) bd.appendChild(el('span','nt','Just published. Give it a try!'));
    bd.appendChild(el('p','s',x.short));
    var c=el('div','chips'); x.tags.slice(0,4).forEach(function(t){c.appendChild(el('span','chip',t))}); bd.appendChild(c);
    bd.appendChild(el('span','btn',glow[x.id]?'Check it out':'View Game'));
    a.appendChild(bd); g.appendChild(a); cards[x.id]=a;
  });

  (window.XEN_SOON||[]).forEach(function(x){
    var c=el('a','gm soon in'), sk=el('div','sk'); c.href='coming-soon.html#'+encodeURIComponent(x.id||''); sk.setAttribute('aria-hidden','true');
    sk.appendChild(el('span','rib','Coming Soon')); sk.appendChild(el('b','',x.icon||'?')); c.appendChild(sk);
    var bd=el('div','bd'); bd.appendChild(el('p','grp',x.genre||'Stay tuned')); bd.appendChild(el('h2','',x.title)); bd.appendChild(el('p','s',x.text)); bd.appendChild(el('div','soonbtn',x.eta||'Coming Soon')); c.appendChild(bd); g.appendChild(c);
  });
  if((window.XEN_SOON||[]).length){var w=el('div','cs'),l=el('a','','See everything coming soon \u2192'); l.href='coming-soon.html'; w.appendChild(l); g.parentNode.appendChild(w);}

  /* golden HIT: most-played game(s) with enough different players (live count from the sheet) */
  function applyHits(stats){
    var hit=T.hits(games,stats);
    Object.keys(cards).forEach(function(id){
      var a=cards[id], has=a.querySelector('.bdg.ht');
      if(hit[id]&&!has){a.insertBefore(el('span','bdg ht','\u2605 Hit'),a.firstChild.nextSibling);a.classList.add('top');}
    });
  }
  applyHits({}); T.stats().then(applyHits);
})();
</script>
</body></html>
